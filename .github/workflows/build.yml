name: Build Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]          
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: keeper
            artifact_name: keeper-linux-x64
          - os: macos-latest
            binary_name: keeper
            artifact_name: keeper-macos-x64
          - os: windows-latest
            binary_name: keeper.exe
            artifact_name: keeper-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/release/keeper-of-the-captured ${{ matrix.binary_name }} || cp target/release/keeper ${{ matrix.binary_name }}
          chmod +x ${{ matrix.binary_name }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path "target\release\keeper-of-the-captured.exe") {
            Copy-Item "target\release\keeper-of-the-captured.exe" -Destination "${{ matrix.binary_name }}"
          } else {
            Copy-Item "target\release\keeper.exe" -Destination "${{ matrix.binary_name }}"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build                        
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # only run on v* tags
    permissions:
      contents: write                   

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts               

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*         
          generate_release_notes: true  
